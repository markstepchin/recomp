<header class="site-header">
  <div
    class="mx-auto flex w-full max-w-[800px] flex-wrap items-center justify-between gap-x-6 gap-y-3 px-gutter py-4"
  >
    <a
      class="text-fg font-bold tracking-wordmark no-underline hover:no-underline"
      href="{{home}}"
      >Recomp</a
    >
    <nav
      class="ml-auto flex flex-wrap items-center gap-x-5 gap-y-2 text-micro"
      aria-label="Site"
    >
      <a
        class="{{nav:blog}}"
        href="{{blog}}"
        {{aria:blog}}
        >Blog</a
      >
      <a
        class="app-store-badge shrink-0"
        href="https://apps.apple.com/us/app/recomp-your-physique-tracker/id6760444125"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Download on the App Store"
      >
        <img
          class="app-store-badge__img app-store-badge__img--black"
          src="{{assets}}download-on-the-app-store-black.svg"
          alt=""
          width="140"
          height="47"
        />
        <img
          class="app-store-badge__img app-store-badge__img--white"
          src="{{assets}}download-on-the-app-store-white.svg"
          alt=""
          width="140"
          height="47"
        />
      </a>
    </nav>
  </div>
</header>
