<!doctype html>
<html lang="en" class="scroll-smooth motion-reduce:scroll-auto" data-theme="system">
  <head>
    <meta charset="utf-8" />
    <!-- chrome:theme -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("recomp-theme");
          if (saved === "light" || saved === "dark" || saved === "system") {
            document.documentElement.setAttribute("data-theme", saved);
          }
        } catch (e) {}
      })();
    </script>
    <style>
      /* Canvas color before the stylesheet. The theme script at the end of the page would otherwise paint the light background first. */
      html {
        background-color: #0a0a0b;
        color-scheme: dark;
      }
      @media (prefers-color-scheme: light) {
        html:not([data-theme="dark"]) {
          background-color: #fafaf9;
          color-scheme: light;
        }
      }
      html[data-theme="light"] {
        background-color: #fafaf9;
        color-scheme: light;
      }
      html[data-theme="dark"] {
        background-color: #0a0a0b;
        color-scheme: dark;
      }
    </style>
    <!-- /chrome:theme -->
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Support — Recomp</title>
    <meta
      name="description"
      content="Get help with Recomp. Email markstepchin@gmail.com. Typical reply within 24–48 hours."
    />
    <link rel="stylesheet" href="../styles/output.css" />
    <link
      rel="canonical"
      href="https://progressphotos.app/support/"
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Recomp" />
    <meta property="og:title" content="Support — Recomp" />
    <meta
      property="og:description"
      content="Email markstepchin@gmail.com for Recomp support."
    />
    <meta
      property="og:url"
      content="https://progressphotos.app/support/"
    />
    <meta
      property="og:image"
      content="https://progressphotos.app/assets/step-compare.webp?v=5"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="../assets/recomp-app-icon.png" type="image/png" />
    <link rel="apple-touch-icon" href="../assets/recomp-app-icon.png" />
  </head>
  <body class="bg-bg font-sans text-body leading-body text-fg transition-[background-color,color,border-color] duration-300 ease-[ease]">
    <div class="flex min-h-dvh flex-col">
      <!-- chrome:header depth="1" -->
      <header class="border-b border-card-border">
        <div
          class="mx-auto flex w-full text-xl max-w-[800px] flex-wrap items-center justify-between gap-x-6 gap-y-3 px-gutter py-4 max-md:py-1"
        >
          <a
            class="inline-flex items-center gap-2 text-fg font-medium tracking-wordmark no-underline hover:no-underline max-md:min-h-11"
            href="../"
          >
            <img
              class="size-8 shrink-0 rounded-[22%] border border-card-border"
              src="../assets/recomp-app-icon.png"
              alt=""
              width="32"
              height="32"
            />
            Recomp
          </a>
          <nav
            class="ml-auto flex flex-wrap items-center gap-x-5 gap-y-2 text-micro"
            aria-label="Site"
          >
            <a
              class="text-muted no-underline hover:text-fg hover:underline max-md:inline-flex max-md:min-h-11 max-md:items-center"
              href="../blog/"
              >Blog</a
            >
            <a
              class="inline-flex shrink-0 no-underline transition-opacity duration-150 hover:no-underline hover:opacity-[0.92] focus-visible:no-underline focus-visible:opacity-[0.92] active:opacity-[0.85] max-md:min-h-11 max-md:items-center"
              href="https://apps.apple.com/us/app/recomp-your-physique-tracker/id6760444125"
              target="_blank"
              rel="noopener noreferrer"
              aria-label="Download on the App Store"
            >
              <img
                class="hidden h-auto w-[140px] light:block"
                src="../assets/download-on-the-app-store-black.svg"
                alt=""
                width="140"
                height="47"
              />
              <img
                class="h-auto w-[140px] light:hidden"
                src="../assets/download-on-the-app-store-white.svg"
                alt=""
                width="140"
                height="47"
              />
            </a>
          </nav>
        </div>
      </header>
      <!-- /chrome:header -->

      <main class="mx-auto w-full max-w-[800px] flex-1 px-gutter py-12">
        <p class="text-micro text-muted pb-3">Support</p>
        <h1 class="text-h2 font-bold tracking-h2 text-balance pb-6">
          Need help?
        </h1>
        <div class="[&>*+*]:mt-[1em] [&_h2]:mt-[2.25em] [&_h2]:text-h3 [&_h2]:leading-h3 [&_h2]:tracking-h3 [&_h2]:font-bold [&_h3]:mt-[1.75em] [&_h3]:text-[1.0625rem] [&_h3]:leading-[1.35] [&_h3]:tracking-h4 [&_h3]:font-bold [&_p]:text-muted [&_li]:text-muted [&_strong]:text-fg [&_strong]:font-semibold [&_ul]:list-disc [&_ul]:pl-5 [&_ol]:list-decimal [&_ol]:pl-5">
          <p>
            Email
            <a href="mailto:markstepchin@gmail.com">markstepchin@gmail.com</a>.
            I typically reply within 24–48 hours.
          </p>
          <p>
            Privacy questions:
            <a href="../privacy/">how Recomp handles data</a>.
          </p>
        </div>
      </main>

      <!-- chrome:footer depth="1" -->
      <footer class="pt-8 pb-8">
        <div class="mx-auto w-full max-w-[800px] px-gutter">
          <div class="flex flex-wrap items-center justify-between gap-x-6 gap-y-4">
            <nav class="grid min-w-0 gap-y-1 text-micro" aria-label="Footer">
              <div class="flex flex-wrap gap-x-6 gap-y-1">
                <a
                  class="text-muted no-underline hover:text-fg hover:underline max-md:inline-flex max-md:min-h-11 max-md:items-center"
                  href="../"
                  >Home</a
                >
                <a
                  class="text-muted no-underline hover:text-fg hover:underline max-md:inline-flex max-md:min-h-11 max-md:items-center"
                  href="../blog/"
                  >Blog</a
                >
                <a
                  class="text-muted no-underline hover:text-fg hover:underline max-md:inline-flex max-md:min-h-11 max-md:items-center"
                  href="../about/"
                  >About</a
                >
              </div>
              <div class="flex flex-wrap gap-x-6 gap-y-1">
                <a
                  class="text-muted no-underline hover:text-fg hover:underline max-md:inline-flex max-md:min-h-11 max-md:items-center"
                  href="../privacy/"
                  >Privacy</a
                >
                <a
                  class="text-muted no-underline hover:text-fg hover:underline max-md:inline-flex max-md:min-h-11 max-md:items-center"
                  href="../support/"
                  >Support</a
                >
                <a
                  class="text-muted no-underline hover:text-fg hover:underline max-md:inline-flex max-md:min-h-11 max-md:items-center"
                  href="../roadmap/"
                  >Roadmap</a
                >
              </div>
            </nav>
            <div
              class="ml-auto inline-flex shrink-0 items-center gap-1 rounded-full border border-card-border bg-card p-1.5"
              role="group"
              aria-label="Color theme"
            >
              <button
                type="button"
                class="min-h-8 cursor-pointer rounded-full border-0 bg-transparent px-2.5 py-1.5 text-xs font-medium text-muted transition-colors duration-200 aria-pressed:bg-accent aria-pressed:text-white"
                data-theme-choice="system"
                aria-pressed="true"
              >
                Auto
              </button>
              <button
                type="button"
                class="min-h-8 cursor-pointer rounded-full border-0 bg-transparent px-2.5 py-1.5 text-xs font-medium text-muted transition-colors duration-200 aria-pressed:bg-accent aria-pressed:text-white"
                data-theme-choice="light"
                aria-pressed="false"
              >
                Light
              </button>
              <button
                type="button"
                class="min-h-8 cursor-pointer rounded-full border-0 bg-transparent px-2.5 py-1.5 text-xs font-medium text-muted transition-colors duration-200 aria-pressed:bg-accent aria-pressed:text-white"
                data-theme-choice="dark"
                aria-pressed="false"
              >
                Dark
              </button>
            </div>
          </div>
        </div>
      </footer>
      <!-- /chrome:footer -->
    </div>
    <script src="../js/posthog.js"></script>
    <script src="../js/theme.js"></script>
  </body>
</html>
