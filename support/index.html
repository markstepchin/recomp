          <a
            class="text-fg font-bold tracking-wordmark no-underline hover:no-underline"
            href="../"
            >Recomp</a
          >
          <nav
            class="flex flex-wrap items-center gap-x-5 gap-y-2 text-micro"
            aria-label="Site"
          >
            <a

              href="../blog/"
              >Blog</a
            >
            <a
              class="text-muted no-underline hover:text-fg hover:underline"
              href="../about/"
              >About</a
            >
            <a
              class="text-muted no-underline hover:text-fg hover:underline"
              href="../privacy/"
              >Privacy</a

            <a

              href="https://apps.apple.com/us/app/recomp-your-physique-tracker/id6760444125"

            >
          </nav>

        <h1 class="text-h2 font-bold tracking-h2 text-balance pb-6">
          Need help?
        </h1>
        <div class="article-prose">
          <p>
            Email
            <a href="mailto:markstepchin@gmail.com">markstepchin@gmail.com</a>.

          </p>
          <p>
            Privacy questions:
            <a href="../privacy/">how Recomp handles data</a>.
          </p>
        </div>

      <footer class="pt-8 pb-8">
        <div class="mx-auto w-full max-w-[800px] px-gutter">
          <div class="flex flex-wrap items-center justify-between gap-6">
            <nav
              class="flex flex-wrap gap-x-6 gap-y-3 text-micro"

                href="../blog/"
                >Blog</a
              >
              <a
                class="text-muted no-underline hover:text-fg hover:underline"

                >About</a

                class="text-muted no-underline hover:text-fg hover:underline"
                href="../privacy/"
                >Privacy</a
              >
              <a
                class="text-muted no-underline hover:text-fg hover:underline"

                class="text-muted no-underline hover:text-fg hover:underline"

              >

              class="inline-flex items-center gap-1 rounded-full border border-card-border bg-card p-1.5"

              aria-label="Color theme"

              <button
                type="button"
                class="min-h-8 cursor-pointer rounded-full border-0 bg-transparent px-2.5 py-1.5 text-xs font-medium text-muted transition-colors duration-200 aria-pressed:bg-accent aria-pressed:text-white"
                data-theme-choice="system"
                aria-pressed="true"
              >
                Auto
              </button>
              <button
                type="button"
                class="min-h-8 cursor-pointer rounded-full border-0 bg-transparent px-2.5 py-1.5 text-xs font-medium text-muted transition-colors duration-200 aria-pressed:bg-accent aria-pressed:text-white"
                data-theme-choice="light"
                aria-pressed="false"
              >
                Light
              </button>
              <button
                type="button"
                class="min-h-8 cursor-pointer rounded-full border-0 bg-transparent px-2.5 py-1.5 text-xs font-medium text-muted transition-colors duration-200 aria-pressed:bg-accent aria-pressed:text-white"
                data-theme-choice="dark"
                aria-pressed="false"
              >
                Dark
              </button>
            </div>
          </div>
        </div>
